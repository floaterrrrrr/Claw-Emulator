name: ClawFrontend
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: CLAW_FRONTEND_FIXTURE
    CODE_SIGNING_ALLOWED: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/HarnessBridge.h"
targets:
  ClawFrontend:
    type: application
    platform: iOS
    sources:
      - path: HarnessApp.swift
      - path: MockCore.mm
      - path: ../../App/ClawApp.swift
      - path: ../../App/ConsoleLibraryModel.swift
      - path: ../../App/ConsoleProfile.swift
      - path: ../../App/ConsoleComponents.swift
      - path: ../../App/ConsoleHomeView.swift
      - path: ../../App/ConsoleImportHub.swift
      - path: ../../App/ConsoleAuthenticLibrary.swift
      - path: ../../App/ConsoleSystemIcon.swift
      - path: ../../App/AppIconPolicy.swift
      - path: ../../App/AppIconSettings.swift
      - path: ../../App/Library.swift
      - path: ../../App/GameModel.swift
      - path: ../../App/GameEngine.swift
      - path: ../../App/ClawTheme.swift
      - path: ../../App/ClawSettings.swift
      - path: ../../App/GameArtwork.swift
      - path: ../../App/GameFileIdentity.swift
      - path: ../../App/LibrarySavesView.swift
      - path: ../../App/GameScreen.swift
      - path: ../../App/AudioActivation.swift
      - path: ../../App/GameControls.swift
      - path: ../../App/GameplayLayout.swift
      - path: ../../App/HandheldControls.swift
      - path: ../../App/HandheldControlsEditor.swift
      - path: ../../App/DeltaSkinArchive.swift
      - path: ../../App/ImportedSkin.swift
      - path: ../../App/ImportedSkinLayout.swift
      - path: ../../App/SkinImageCodec.swift
      - path: ../../App/SkinSettingsView.swift
      - path: ../../App/ControllerSkinLayout.swift
      - path: ../../App/VirtualSkinOverlay.swift
      - path: ../../App/Assets.xcassets
      - path: ../../App/ControllerSkin
        type: folder
        buildPhase: resources
      - path: ../../App/GameUtilitiesOverlay.swift
      - path: ../../App/LegalDocumentView.swift
      - path: ../../App/Legal
        buildPhase: resources
      - path: ../../App/SaveStateStore.swift
      - path: ../../App/SaveStateManager.swift
      - path: ../../App/OrientationPolicy.swift
      - path: ../../Native/SkinArchive.cpp
      - path: ../../Native/InputMath.cpp
    info:
      path: .generated/Info.plist
      properties:
        CFBundleDisplayName: Claw Layout Fixture
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.claw.frontend.fixture
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconOrange AppIconBlue AppIconGreen AppIconRed"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        OTHER_LDFLAGS: "$(inherited) -lz"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../Native"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
  FrontendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.claw.frontend.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - target: ClawFrontend
schemes:
  ClawFrontend:
    build:
      targets:
        ClawFrontend: all
    test:
      targets: [FrontendUITests]
